<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0ea5a0" />
  <title>Meine Rechner</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #fff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0ea5a0;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #2dd4bf;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: max(20px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom));
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 420px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin: 8px 0 6px; letter-spacing: -0.02em; }
    p { color: var(--muted); margin: 0 0 20px; line-height: 1.45; }
    a.card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      transition: border-color 0.15s ease;
      min-height: 72px;
    }
    a.card:hover, a.card:focus-visible {
      border-color: var(--accent);
      outline: none;
    }
    .title { font-weight: 700; font-size: 1.1rem; margin-bottom: 4px; }
    .desc { color: var(--muted); font-size: 0.92rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Meine Rechner</h1>
    <p>Kleine Tools für den Alltag — später kommen weitere hinzu.</p>
    <a class="card" href="./bmi/">
      <div class="badge">BMI</div>
      <div class="title">BMI-Rechner</div>
      <div class="desc">Body-Mass-Index und Zielgewichte für deine Größe</div>
    </a>
    <a class="card" href="./perfusor/" style="margin-top:12px">
      <div class="badge" style="font-size:11px">ml/h</div>
      <div class="title">Perfusor-Rechner</div>
      <div class="desc">Laufraten in ml/h für Remifentanil, Propofol und Noradrenalin</div>
    </a>
  </div>
</body>
</html>
